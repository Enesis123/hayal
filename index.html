<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hayal</title>
<meta name="theme-color" content="#0f0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hayal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root {
    --bg: #0f0d14;
    --panel: #1a1722;
    --panel2: #231f2e;
    --line: #322c40;
    --text: #eeeaf5;
    --dim: #9a93aa;
    --accent: #ff8a4c;
    --accent2: #ffb36b;
    --bad: #ff6b7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  main { max-width: 980px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 18px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  header span { color: var(--dim); font-size: 14px; }

  .composer { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; font-size: 17px; }
  textarea::placeholder { color: #6d6680; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .chip { border: 1px solid var(--line); background: var(--panel2); color: var(--dim); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: #3a2620; }

  .models { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; }
  .model { border: 1px solid var(--line); background: var(--panel2); color: var(--dim); border-radius: 10px;
    padding: 8px 10px; font: inherit; text-align: left; cursor: pointer; }
  .model b { display: block; color: var(--text); font-size: 14px; }
  .model small { font-size: 12px; }
  .model[aria-pressed="true"] { border-color: var(--accent); background: #3a2620; }
  .quota { color: #6d6680; font-size: 13px; margin: 0 2px; }

  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .count { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .count button { background: var(--panel2); color: var(--dim); border: 0; padding: 8px 13px; font: inherit; cursor: pointer; }
  .count button[aria-pressed="true"] { background: var(--accent); color: #1a0f08; font-weight: 600; }
  .count-label { color: var(--dim); font-size: 14px; }
  .go { margin-left: auto; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #1a0f08;
    border: 0; border-radius: 10px; padding: 10px 22px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
  .go:disabled { opacity: .5; cursor: default; }

  .status { min-height: 22px; margin: 10px 2px 4px; color: var(--dim); font-size: 14px; }
  .status.bad { color: var(--bad); }

  .bar { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 10px; }
  .bar h2 { margin: 0; font-size: 17px; }
  .linkbtn { background: none; border: 0; color: var(--dim); font: inherit; font-size: 14px; cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .card .pic { aspect-ratio: 1; background: var(--panel2); display: grid; place-items: center; cursor: zoom-in; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .meta { padding: 8px 10px 10px; }
  .card .prompt { font-size: 13px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .card .tools { display: flex; gap: 4px; margin-top: 8px; }
  .card .tools button { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 0; font-size: 15px; cursor: pointer; }
  .card .engine { font-size: 11px; color: #6d6680; margin-top: 4px; }

  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line);
    border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card.fail .pic { color: var(--bad); font-size: 13px; padding: 16px; text-align: center; cursor: default; }

  .empty { color: #6d6680; text-align: center; padding: 40px 0; grid-column: 1 / -1; }

  .viewer { position: fixed; inset: 0; background: rgba(5,4,8,.92); display: none; place-items: center;
    padding: 16px; z-index: 10; cursor: zoom-out; }
  .viewer.open { display: grid; }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: 10px; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .go { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Hayal</h1>
    <span>yaz, çizsin</span>
  </header>

  <section class="composer">
    <textarea id="prompt" placeholder="Ne çizeyim? Türkçe yazabilirsin. Örnek: yağmurlu bir gecede İstanbul'da kırmızı şemsiyeli kedi"></textarea>
    <div class="chips" id="styles"></div>
    <div class="models" id="models"></div>
    <div class="row">
      <span class="count-label">Adet</span>
      <div class="count" id="count"></div>
      <button class="go" id="go">Çiz</button>
    </div>
  </section>

  <div class="status" id="status"></div>
  <div class="quota" id="quota"></div>

  <div class="bar">
    <h2>Galeri</h2>
    <button class="linkbtn" id="clear">Hepsini sil</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="viewer" id="viewer"><img alt=""></div>

<script src="app.js"></script>
</body>
</html>
